<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣求職避雷器</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1> 台灣求職避雷器</h1>
        
        <!-- 立即分析按鈕區 -->
        <div class="run-panel">
            <button id="run-btn" class="btn-run"> 立即分析此頁面</button>
            <div id="run-status" class="run-status"></div>
        </div>

        <!-- Console log 區塊 -->
        <div class="console-panel">
            <div class="console-header">
                <span>執行日誌</span>
                <button id="clear-log" class="btn-clear">清除</button>
            </div>
            <div id="console-log" class="console-log"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="settings"> 設定</button>
            <button class="tab-btn" data-tab="connection"> 連線</button>
            <button class="tab-btn" data-tab="about">關於</button>
        </div>

        <!-- 設定標籤 -->
        <div id="settings" class="tab-content active">
            <h2>模型配置</h2>
            
            <div class="config-group">
                <label>
                    <input type="radio" name="model" value="openai" id="model-openai">
                    OpenAI API
                </label>
                <input type="password" id="openai-key" placeholder="輸入 OpenAI API Key" class="hidden">
            </div>

            <div class="config-group">
                <label>
                    <input type="radio" name="model" value="claude" id="model-claude">
                    Claude API
                </label>
                <input type="password" id="claude-key" placeholder="輸入 Claude API Key" class="hidden">
            </div>

            <div class="config-group">
                <label>
                    <input type="radio" name="model" value="local" id="model-local">
                    本地模型 (Ollama)
                </label>
                <input type="text" id="local-url" placeholder="http://localhost:11434" class="hidden">
            </div>

            <button id="save-btn" class="btn-primary">保存設定</button>
            
            <div id="status" class="status-message"></div>

            <h2>功能選項</h2>
            <label>
                <input type="checkbox" id="auto-analyze">
                自動分析職位 (進入 104 時)
            </label>
            <label>
                <input type="checkbox" id="show-stats">
                顯示薪資統計
            </label>
        </div>

        <!-- 連線設定標籤 -->
        <div id="connection" class="tab-content">
            <h2>後端 API 設定</h2>
            <div class="config-group">
                <label class="group-label">後端伺服器 URL</label>
                <div class="input-row">
                    <input type="text" id="backend-url" placeholder="http://localhost:5000">
                    <button id="test-backend" class="btn-test">測試</button>
                </div>
                <div id="backend-status" class="conn-status"></div>
            </div>

            <h2>Ollama 本地模型</h2>
            <div class="config-group">
                <label class="toggle-label">
                    <span>直接模式（不經後端，直接調用 Ollama）</span>
                    <label class="switch">
                        <input type="checkbox" id="direct-mode">
                        <span class="slider"></span>
                    </label>
                </label>
            </div>
            <div class="config-group">
                <label class="group-label">Ollama URL</label>
                <div class="input-row">
                    <input type="text" id="ollama-url" placeholder="http://localhost:11434">
                    <button id="test-ollama" class="btn-test">測試</button>
                </div>
                <div id="ollama-status" class="conn-status"></div>
            </div>
            <div class="config-group">
                <label class="group-label">選擇模型</label>
                <div class="input-row">
                    <select id="ollama-model-select" class="model-select">
                        <option value="">-- 請先測試 Ollama 連線 --</option>
                    </select>
                    <button id="refresh-models" class="btn-test" title="重新整理模型列表">↻</button>
                </div>
            </div>

            <button id="save-connection-btn" class="btn-primary">保存連線設定</button>
            <div id="conn-save-status" class="status-message"></div>

            <!-- LSTM 本地模型 -->
            <h2>本地訓練模型 (LSTM)</h2>
            <div class="config-group">
                <label class="toggle-label">
                    <span>啟用本地 LSTM 模型篩選</span>
                    <label class="switch">
                        <input type="checkbox" id="use-lstm" checked>
                        <span class="slider"></span>
                    </label>
                </label>
                <p class="hint-text">開啟後，每筆職缺會額外顯示「好缺／普通／屎缺」預測標籤</p>
            </div>
            <div class="config-group">
                <div class="input-row">
                    <button id="check-lstm" class="btn-test">檢查模型狀態</button>
                    <div id="lstm-status" class="conn-status"></div>
                </div>
                <p class="hint-text">
                    模型未就緒時請執行：<code>python ml/train_lstm.py</code>
                </p>
            </div>
        </div>

        <!-- 關於標籤 -->
        <div id="about" class="tab-content">
            <h2>關於此工具</h2>
            <p>
                這是一個開源工具，幫助台灣勞工識別低薪高用的職缺。
            </p>
            <p>
                <strong>功能：</strong>
            </p>
            <ul>
                <li>自動分析 104 上的職位</li>
                <li>比對薪資標準</li>
                <li>標記風險職缺</li>
                <li>支援本地 AI 模型</li>
            </ul>
            <p>
                <strong>開源地址：</strong> 
                <a href="#" target="_blank">GitHub</a>
            </p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
